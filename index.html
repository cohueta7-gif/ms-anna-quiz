<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ms Anna Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Ms Anna English Quiz</h1>
<label>Student name:</label>
<input id="name" placeholder="Enter your name">

<h2>Choose the correct answer</h2>

<div class="question">
<p>1. I am interested in _____ music after school.</p>
<label><input type="radio" name="q1" value="0"> listen</label>
<label><input type="radio" name="q1" value="1"> listening</label>
<label><input type="radio" name="q1" value="0"> listened</label>
<label><input type="radio" name="q1" value="0"> listens</label>
</div>

<div class="question">
<p>2. This book is more interesting than that book.</p>
<label><input type="radio" name="q2" value="1"> True</label>
<label><input type="radio" name="q2" value="0"> False</label>
</div>

<button onclick="submitQuiz()">Submit</button>

<div id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
